# Every version in one place: the WPILib and AdvantageKit libraries Pitwall is written against, and
# the build's and the tests' own.

[versions]
# This release of the FRC libraries (the model, localization, Pitwall, the runtime): what this build
# publishes as (gradle/publishing.gradle), and the robot model's version it reads. All of them share
# it, so a release is one change, here.
frc-libs = "2026.10.22"
# WPILib's libraries, each at the version WPILib's own release uses: a robot program's GradleRIO
# brings the same, and Pitwall compiles against them without bundling them.
wpilib = "2027.0.0-alpha-7"
# AdvantageKit, at the version a robot program's vendordeps/AdvantageKit.json pins.
advantagekit = "27.0.0-alpha-6"
avaje-jsonb = "3.14"
quickbuf = "1.4"
ejml = "0.46.0"
spotless = "8.10.4"
# The formatters Spotless runs (gradle/quality.gradle), pinned rather than left to Spotless's
# defaults, so a newer Spotless can't reformat the code on its own: a formatter's new version is a
# change of its own, with the reformatting it brings. Dependabot doesn't see them: bump them by hand.
# greclipse is the Eclipse release whose Groovy formatter formats the build files.
google-java-format = "1.36.1"
greclipse = "4.35"
errorprone-plugin = "5.1.1"
errorprone = "2.50.0"
nullaway = "0.14.2"
jspecify = "1.0.1"
jacoco = "0.8.15"
junit = "6.1.3"
assertj = "3.27.7"
archunit = "1.5.1"
three = "0.181.1"
# The robot model's records are annotated for the builders generated beside them: the compiler
# reads the annotations, so they are on Pitwall's compile classpath, at the model's version.
recordbuilder = "53"

[libraries]
frc-robot-model = { module = "com.michaelgrundvig.frc:frc-robot-model", version.ref = "frc-libs" }
wpilib-fields = { module = "org.wpilib.fields:fields-java", version.ref = "wpilib" }
ejml-simple = { module = "org.ejml:ejml-simple", version.ref = "ejml" }
# WPILib's units appear in the tuner's API, so they are Pitwall's own (api); the rest the robot
# program supplies.
wpilib-units = { module = "org.wpilib.wpiunits:wpiunits-java", version.ref = "wpilib" }
wpilib-math = { module = "org.wpilib.wpimath:wpimath-java", version.ref = "wpilib" }
wpilib-util = { module = "org.wpilib.wpiutil:wpiutil-java", version.ref = "wpilib" }
wpilib-tunables = { module = "org.wpilib.tunables:tunables-java", version.ref = "wpilib" }
wpilib-hal = { module = "org.wpilib.hal:hal-java", version.ref = "wpilib" }
wpilib-ntcore = { module = "org.wpilib.ntcore:ntcore-java", version.ref = "wpilib" }
wpilib-wpilibj = { module = "org.wpilib.wpilibj:wpilibj-java", version.ref = "wpilib" }
wpilib-commands3 = { module = "org.wpilib:commandsv3-java", version.ref = "wpilib" }
advantagekit = { module = "org.littletonrobotics.akit:akit-java", version.ref = "advantagekit" }
avaje-jsonb = { module = "io.avaje:avaje-jsonb", version.ref = "avaje-jsonb" }
# What a call into WPILib or AdvantageKit names in its signature (AdvantageKit's recordOutput takes a protobuf message).
quickbuf-runtime = { module = "us.hebi.quickbuf:quickbuf-runtime", version.ref = "quickbuf" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
# three.js, which draws Pitwall's scenes, as its WebJar: the build takes the few files the page
# loads out of it (build.gradle).
recordbuilder-core = { module = "io.soabase.record-builder:record-builder-core", version.ref = "recordbuilder" }
three-webjar = { module = "org.webjars.npm:three", version.ref = "three" }

[plugins]
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
