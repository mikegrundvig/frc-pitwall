# Coverage floor (gradle/quality.gradle): the build fails if test coverage drops below these
# percentages of production code, generated code excluded. 50% catches code with no tests at all,
# without every change chasing a number while the code is in heavy development.
line=50.0
branch=50.0
# Every source file on its own, too: a file with no tests fails the build even while the rest of
# the code carries the total. file.exempt lists files left out (comma-separated), each for a reason
# given here. Pitwall, AdvantageKitLog, and the simulator's WpilibHal need WPILib's native HAL or
# AdvantageKit's running logger, which only a robot program's tests load. They need tests of their
# own before Pitwall ships as a library on its own.
file.line=50.0
file.exempt=com/michaelgrundvig/frc/pitwall/Pitwall.java,com/michaelgrundvig/frc/pitwall/AdvantageKitLog.java,com/michaelgrundvig/frc/pitwall/simulator/WpilibHal.java
