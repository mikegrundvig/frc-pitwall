# Weekly pull requests for newer build tools, test libraries, and CI actions. WPILib's and
# AdvantageKit's libraries are updated deliberately, per WPILib release, not by this bot, and so are
# the libraries that must match the version WPILib's release uses (the JSON library and the protobuf
# runtime), and Gradle itself.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "org.wpilib*"
      - dependency-name: "org.littletonrobotics*"
      - dependency-name: "io.avaje:avaje-jsonb"
      - dependency-name: "us.hebi.quickbuf:quickbuf-runtime"
      - dependency-name: "gradle-wrapper"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
